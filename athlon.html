<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATHLON — RetroBot CI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    /* ── Header ── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 48px;
      height: 64px;
      background: rgba(10,10,10,0.90);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #1e1e1e;
    }
    nav { display: flex; gap: 32px; align-items: center; }
    nav a {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: #888;
      transition: color 0.2s;
    }
    nav a:hover { color: #fff; }

    /* ── Title Section ── */
    .title-section {
      padding: 120px 48px 60px;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 36px;
    }
    .title-section h1 {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .title-section .year {
      font-size: 36px;
      font-weight: 400;
      color: #888;
    }
    /* Logo beside its description rather than above it. */
    .work-head {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
    }
    /* 180px, the height the sibling pages give their logos. The artwork sits
       inside a little clear space in the file - 3px above and 10 either side,
       a shade less once scaled down - which would otherwise be added to the
       gaps around it; pulling those back makes the gap set the gap seen. */
    .tobot-logo {
      height: 180px; width: auto;
      margin: -3px -9px 0 -9px;
    }
    .info-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      color: #7eb8b0;
      font-size: 16px;
      /* The section centres its children, so the list sits in the middle as a
         block; this ranges the lines against each other inside it rather than
         leaving them centred and ragged on both sides. */
      text-align: left;
    }
    /* no colour of its own, so the bullet takes the list's; the gap is a margin
       rather than a space in the content, which a space would not hold open */
    .info-list li::before { content: "•"; margin-right: 10px; }

    /* ── Gallery ── */
    .gallery {
      padding: 0 48px 100px;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .gallery img.wide { width: 100%; }
    .gallery .pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .gallery .pair img { width: 100%; }

    /* Once the row wraps, the logo is above the text rather than beside it, so
       the side pull that closed the gap between them now just knocks it off
       centre. The vertical one still earns its keep. A fixed height with
       max-width clamping the other side squashes the logo on a narrow screen,
       so the height goes back to being the image's own. */
    @media (max-width: 640px) {
      .tobot-logo { height: auto; margin-left: 0; margin-right: 0; }
      .title-section h1 { font-size: 32px; }
      .title-section .year { font-size: 24px; }
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid #1e1e1e;
      padding: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    footer img { height: 40px; width: auto; }
    footer p { font-size: 12px; color: #444; letter-spacing: 0.03em; }
  </style>
</head>
<body>

<!-- ── Header ── -->
<header>
  <nav>
    <a href="index.html">Home</a>
    <a href="index.html#works">Works</a>
    <a href="index.html#services">Services</a>
    <a href="index.html#about">About</a>
    <a href="news.html">News</a>
    <a href="index.html#contact">Contact</a>
  </nav>
</header>

<!-- ── Title ── -->
<section class="title-section">
  <h1>ATHLON <span class="year">(2016-2017)</span></h1>
  <div class="work-head">
    <img class="tobot-logo" src="post-images/1ab44f_0b2d8b2460014daca5bcab87a7866222~mv2.png" alt="ATHLON Logo">
    <ul class="info-list">
      <li>A TV series animation mainly targeting boys aged 4–7</li>
      <li>10 minutes × 21 episodes</li>
      <li>A spin-off of <em>TOBOT</em></li>
      <li>Co-produced by YoungToys and RetroBot</li>
    </ul>
  </div>
</section>

<!-- ── Gallery ── -->
<div class="gallery">
  <img class="wide" src="post-images/1ab44f_8e8c436b73f046e4b30606f0b15043b4~mv2.jpg" alt="ATHLON" loading="lazy">
  <img class="wide" src="post-images/1ab44f_9ef3fdf09de8452f855cc02e9fc5ac99~mv2.jpg" alt="ATHLON" loading="lazy">
  <div class="pair">
    <img src="post-images/1ab44f_c6110fa0438f437795c234cc1c833477~mv2.jpg" alt="ATHLON" loading="lazy">
    <img src="post-images/1ab44f_8f135540969c4bb6b14c429177646bc6~mv2.jpg" alt="ATHLON" loading="lazy">
  </div>
  <img class="wide" src="post-images/1ab44f_6fba9f0b413744e1b5a1b9ce757154e5~mv2.jpg" alt="ATHLON" loading="lazy">
  <img class="wide" src="post-images/1ab44f_6f528b69b0014e0980e10dafd760bc21~mv2.jpg" alt="ATHLON" loading="lazy">
</div>

<!-- ── Footer ── -->
<footer>
  <a href="index.html">
    <img src="post-images/1ab44f_b4e1291ff6614694b1631f2ab912f957~mv2.png" alt="RetroBot CI">
  </a>
  <p>&copy; 2026 RetroBot CI Inc. All Rights Reserved.</p>
</footer>

</body>
</html>
