<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOBOT The Movie: Attack Of The Robot Force — RetroBot CI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    /* ── Header ── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 48px;
      height: 64px;
      background: rgba(10,10,10,0.90);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #1e1e1e;
    }
    nav { display: flex; gap: 32px; align-items: center; }
    nav a {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: #888;
      transition: color 0.2s;
    }
    nav a:hover { color: #fff; }

    /* ── Title Section ── */
    .title-section {
      padding: 120px 48px 60px;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 36px;
    }
    .title-section h1 {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .title-section .year {
      font-size: 36px;
      font-weight: 400;
      color: #888;
    }
    /* Logo beside its description rather than above it. */
    .work-head {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
    }
    /* The image's own size, so it is never resampled. The artwork sits inside
       clear space in its file - 31px above, 46px below, 70 and 72 either side -
       which would otherwise be added to the gaps around it; pulling all four
       back makes the gap you set the gap you see. */
    .tobot-logo {
      height: auto; width: auto;
      margin: -31px -72px -46px -70px;
    }
    .info-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      color: #7eb8b0;
      font-size: 16px;
      /* The section centres its children, so the list sits in the middle as a
         block; this ranges the lines against each other inside it rather than
         leaving them centred and ragged on both sides. */
      text-align: left;
    }
    /* no colour of its own, so the bullet takes the list's; the gap is a margin
       rather than a space in the content, which a space would not hold open */
    .info-list li::before { content: "•"; margin-right: 10px; }

    /* ── Video ── */
    .video-section {
      padding: 0 48px 60px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .video-wrapper {
      position: relative;
      aspect-ratio: 16/9;
      background: #111;
      overflow: hidden;
    }
    .video-wrapper iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* ── Gallery ── */
    .gallery {
      padding: 0 48px 100px;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    /* Square corners throughout. A 4px radius reads as a rounded box against a
       light corner and as nothing at all against a dark one, so with these
       stills it looked applied to some and not others. */
    .gallery img.wide {
      width: 100%;
      object-fit: cover;
    }
    .gallery .pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .gallery .pair img {
      width: 100%;
      object-fit: cover;
    }
    /* The stills come in at 1.80 to 1.86, close enough to look like a mistake
       rather than a choice when their bottoms fail to line up. One ratio for
       all of them squares the rows off; cover takes the difference off the
       sides. Posters keep their own ratio - both are 1:1.425, so they already
       agree. */
    .gallery .pair.stills img { aspect-ratio: 16 / 9; }

    /* Once the row wraps, the logo is above the text rather than beside it, so
       the side pull that closed the gap between them now just knocks it off
       centre. The vertical one still earns its keep. */
    @media (max-width: 640px) {
      .tobot-logo { margin-left: 0; margin-right: 0; }
      /* 48px leaves the subtitle needing twice the width a phone has, so the
         title arrives in six lines instead of the two it is written as. */
      .title-section h1 { font-size: 28px; }
      .title-section .year { font-size: 21px; }
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid #1e1e1e;
      padding: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    footer img { height: 40px; width: auto; }
    footer p { font-size: 12px; color: #444; letter-spacing: 0.03em; }
  </style>
</head>
